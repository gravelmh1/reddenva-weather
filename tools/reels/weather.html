<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: "Noto Sans CJK KR", sans-serif; color: #fff; letter-spacing: -0.02em;
         background: radial-gradient(1200px 900px at 50% 20%, #24457f 0%, #14284d 55%, #0c1a35 100%); }
  .abs { position: absolute; left: 0; width: 1080px; text-align: center; will-change: transform, opacity; }
  #snow { position: absolute; inset: 0; }
  .flake { position: absolute; border-radius: 50%; background: #dfe9ff; }
  .chip { display: inline-block; padding: 14px 34px; border-radius: 999px; background: rgba(255,255,255,.12);
          font-size: 40px; font-weight: 500; color: #d6e0f5; }
  .kicker { font-size: 40px; font-weight: 700; color: #ffb27a; letter-spacing: .02em; }
  .title { font-size: 76px; font-weight: 900; line-height: 1.15; }
  #big { font-size: 400px; font-weight: 900; letter-spacing: -0.06em; line-height: 1; }
  #big .deg { font-size: 260px; vertical-align: top; position: relative; top: 30px; }
  .pill { display: inline-flex; align-items: center; gap: 18px; padding: 26px 50px; border-radius: 999px;
          background: #1f6fe5; font-size: 66px; font-weight: 900; box-shadow: 0 20px 60px rgba(31,111,229,.45); }
  .pill .tri { font-size: 52px; }
  .panel { background: #fff; color: #14284d; border-radius: 44px; box-shadow: 0 30px 80px rgba(0,0,0,.35); }
  .tiles { display: flex; gap: 32px; justify-content: center; }
  .tile { width: 452px; height: 380px; padding: 44px 48px; text-align: left; }
  .tile .l { font-size: 44px; font-weight: 700; color: #6f7a90; }
  .tile .n { font-size: 230px; font-weight: 900; letter-spacing: -0.06em; line-height: 1.05; }
  .row { width: 936px; margin: 0 auto; display: flex; align-items: center; gap: 30px; padding: 30px 40px; text-align: left; }
  .row .tag { flex: none; padding: 10px 26px; border-radius: 18px; background: #e6ecf7; font-size: 38px; font-weight: 700; color: #3b4a68; }
  .row .v { font-size: 50px; font-weight: 700; }
  #week { width: 960px; height: 760px; margin: 0 auto; padding: 40px 18px; display: flex; }
  .col { flex: 1; position: relative; text-align: center; border-radius: 30px; }
  .col.today { background: #fdeee4; }
  .col .d { font-size: 42px; font-weight: 700; margin-top: 10px; }
  .col .ic { font-family: "Noto Color Emoji"; font-size: 64px; margin-top: 18px; display: block; }
  .col .bar { position: absolute; left: 50%; width: 30px; margin-left: -15px; border-radius: 15px; }
  .col .hi, .col .lo { position: absolute; width: 100%; font-size: 38px; font-weight: 700; }
  .col .hi { color: #e0482a; } .col .lo { color: #1f6fe5; }
  .handle { font-size: 40px; font-weight: 500; color: #aebbd8; }
  img.char { display: block; margin: 0 auto; filter: drop-shadow(0 18px 30px rgba(0,0,0,.35)); }
</style></head>
<body>
<div id="snow"></div>

<!-- 장면 1: 훅 -->
<div class="abs" id="s1chip" style="top:250px"><span class="chip" id="chip"></span></div>
<div class="abs" id="s1lab" style="top:440px;font-size:50px;font-weight:700;color:#aebbd8">출근길 아침 7~9시</div>
<div class="abs" id="big" style="top:520px"><span id="bign"></span><span class="deg">°</span></div>
<div class="abs" id="s1pill" style="top:960px"><span class="pill" id="pill"></span></div>
<div class="abs" id="s1char" style="top:1150px"><img class="char" id="c1" height="330"></div>

<!-- 장면 2: 오늘 하루 -->
<div class="abs" id="s2head" style="top:250px"><div class="kicker">오늘 하루</div><div class="title" id="s2title"></div></div>
<div class="abs" id="s2tiles" style="top:500px"><div class="tiles">
  <div class="panel tile" id="t1"><div class="l">낮 최고</div><div class="n" style="color:#e0482a"><span id="hin"></span>°</div></div>
  <div class="panel tile" id="t2"><div class="l">밤 최저</div><div class="n" style="color:#1f6fe5"><span id="lon"></span>°</div></div>
</div></div>
<div class="abs" id="r1" style="top:920px"><div class="panel row"><span class="tag">우산</span><span class="v" id="rain"></span></div></div>
<div class="abs" id="r2" style="top:1070px"><div class="panel row"><span class="tag">옷차림</span><span class="v" id="outfit"></span></div></div>
<div class="abs" id="s2char" style="top:1230px"><img class="char" id="c2" height="270"></div>

<!-- 장면 3: 이번 주 -->
<div class="abs" id="s3head" style="top:250px"><div class="kicker">이번 주</div><div class="title" id="s3title"></div></div>
<div class="abs" id="s3panel" style="top:500px"><div class="panel" id="week"></div></div>



<!-- 마지막: 원래 카드 전체 -->
<div class="abs" id="fk" style="top:120px"><div class="kicker">한 장으로 보기</div></div>
<div id="final" style="position:absolute;left:40px;top:200px;width:1000px;height:1250px;overflow:hidden;border-radius:36px;box-shadow:0 30px 90px rgba(0,0,0,.5);opacity:0"></div>
<script src="lib.js"></script>
<script>
const D = window.DATA;
$("#final").innerHTML = `<div id="strip" style="display:flex;width:${1000 * D.cards.length}px">` +
  D.cards.map(c => `<img src="${c}" style="width:1000px;height:1250px;display:block">`).join("") + "</div>";
const POSE = n => `../../assets/poses/${n}.png`;
$("#chip").textContent = `${D.city} · ${D.date} ${D.dow}`;
$("#pill").innerHTML = `<span class="tri">${D.delta < 0 ? "▼" : "▲"}</span> 어제보다 ${Math.abs(D.delta)}° ${D.delta < 0 ? "추워요" : "따뜻해요"}`;
$("#s2title").textContent = D.day_title;
$("#rain").textContent = D.rain; $("#outfit").textContent = D.outfit;
$("#s3title").textContent = D.week_title;

$("#c1").src = POSE(D.pose); $("#c2").src = POSE(D.pose2);

// 주간 막대
const lo = Math.min(...D.week.map(w => w.lo)) - 1, hi = Math.max(...D.week.map(w => w.hi)) + 1;
const Y0 = 210, HH = 380, yOf = v => Y0 + HH * (hi - v) / (hi - lo);
D.week.forEach((w, i) => {
  const c = document.createElement("div"); c.className = "col" + (w.today ? " today" : "");
  const col = w.d === "토" ? "#1f6fe5" : w.d === "일" ? "#e0482a" : w.today ? "#e0482a" : "#14284d";
  c.innerHTML = `<div class="d" style="color:${col}">${w.d}</div><span class="ic">${w.ic}</span>
    <div class="hi" style="top:${yOf(w.hi) - 56}px">${w.hi}°</div>
    <div class="bar" style="top:${yOf(w.hi)}px;height:${yOf(w.lo) - yOf(w.hi)}px;background:${w.today ? "linear-gradient(#ff9a6b,#ff7a45)" : "linear-gradient(#ffb48f,#9cc0ff)"}"></div>
    <div class="lo" style="top:${yOf(w.lo) + 8}px">${w.lo}°</div>`;
  $("#week").appendChild(c);
});

// 서리 입자 (고정 난수)
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const flakes = Array.from({ length: 46 }, () => ({ x: rnd() * 1080, y: rnd() * 1920, r: 3 + rnd() * 7, v: 40 + rnd() * 90, a: .15 + rnd() * .4, w: rnd() * 6 }));
flakes.forEach(f => { const e = document.createElement("div"); e.className = "flake"; e.style.width = e.style.height = f.r * 2 + "px"; e.style.opacity = f.a; f.el = e; $("#snow").appendChild(e); });

window.render = (t, T = t) => {
  flakes.forEach(f => { f.el.style.transform = `translate(${f.x + Math.sin(T + f.w) * 20}px,${(f.y + T * f.v) % 1960 - 40}px)`; });
  // 장면 1 (0 ~ 3.3초)
  const o1 = 1 - P(t, 3.0, 3.4, easeInOut), up1 = -80 * P(t, 3.0, 3.4, easeInOut);
  set("#s1chip", { o: P(t, 0, .4) * o1, y: -30 * (1 - P(t, 0, .4)) + up1 });
  set("#s1lab", { o: P(t, .15, .55) * o1, y: 30 * (1 - P(t, .15, .55)) + up1 });
  const k = P(t, .45, 1.45, easeInOut);
  $("#bign").textContent = fmt(lerp(D.yday, D.today, k));
  set("#big", { o: P(t, .2, .5) * o1, s: .9 + .1 * P(t, .2, .7, back) + .04 * (1 - Math.abs(1 - 2 * k)) * 0, y: up1 });
  set("#s1pill", { o: P(t, 1.45, 1.7) * o1, s: .6 + .4 * P(t, 1.45, 1.9, back), y: up1 });
  set("#s1char", { o: P(t, .5, .8) * o1, y: 260 * (1 - P(t, .5, 1.1, back)) + breathe(T) + up1 * .5 });
  // 장면 2 (3.3 ~ 6.6초)
  const o2 = 1 - P(t, 6.3, 6.7, easeInOut), up2 = -80 * P(t, 6.3, 6.7, easeInOut);
  set("#s2head", { o: P(t, 3.3, 3.7) * o2, y: 60 * (1 - P(t, 3.3, 3.7)) + up2 });
  set("#t1", { o: P(t, 3.5, 3.85) * o2, y: 120 * (1 - P(t, 3.5, 4.0, back)) + up2 });
  set("#t2", { o: P(t, 3.65, 4.0) * o2, y: 120 * (1 - P(t, 3.65, 4.15, back)) + up2 });
  $("#hin").textContent = fmt(D.hi * P(t, 3.6, 4.6, easeInOut));
  $("#lon").textContent = fmt(D.lo * P(t, 3.75, 4.75, easeInOut));
  set("#r1", { o: P(t, 4.4, 4.75) * o2, x: -120 * (1 - P(t, 4.4, 4.85)) + 0, y: up2 });
  set("#r2", { o: P(t, 4.65, 5.0) * o2, x: -120 * (1 - P(t, 4.65, 5.1)), y: up2 });
  set("#s2char", { o: P(t, 4.9, 5.2) * o2, y: 200 * (1 - P(t, 4.9, 5.5, back)) + breathe(T) + up2 });
  // 장면 3 (6.6 ~ 9.3초)
  const o3 = 1 - P(t, 9.0, 9.35, easeInOut);
  set("#s3head", { o: P(t, 6.6, 7.0) * o3, y: 60 * (1 - P(t, 6.6, 7.0)) });
  set("#s3panel", { o: P(t, 6.7, 7.05) * o3, y: 100 * (1 - P(t, 6.7, 7.2)) });
  $$(".col").forEach((c, i) => {
    const a = 7.0 + i * .12, g = P(t, a, a + .5, back);
    c.querySelector(".ic").style.transform = `scale(${g})`;
    const b = c.querySelector(".bar"); b.style.transform = `scaleY(${P(t, a + .1, a + .6)})`;
    c.querySelector(".hi").style.opacity = c.querySelector(".lo").style.opacity = P(t, a + .4, a + .7);
    c.querySelector(".d").style.opacity = P(t, a - .1, a + .2);
  });
  // 마지막 (9.3초~): 원래 카드 전체. 카드가 2장이면 옆으로 넘김
  set("#fk", { o: P(t, 9.3, 9.7), y: 30 * (1 - P(t, 9.3, 9.7)) });
  set("#final", { o: P(t, 9.3, 9.6), y: 160 * (1 - P(t, 9.3, 9.8, back)), s: .92 + .08 * P(t, 9.3, 9.8) });
  $("#strip").style.transform = `translateX(${-1000 * P(t, 10.0, 10.45, easeInOut)}px)`;
};
waitImages();
</script>
</body></html>
