name: weather-us
on:
  schedule:
    # 예비 카드: GitHub 예약 실행은 2~5시간씩 늦게 와서, LA 전날 밤 21:40부터 새벽 01:40까지(표준시 기준) 한 시간마다 걸어 두면 그중 몇 번은 새벽 00:05~05:59 사이에 도착해요.
    # 실제 게시는 Make가 06:05에 깨워서 새로 만들고, 그때 날씨 서버가 죽어 있으면 이 예비 카드를 써요.
    - cron: "40 5,6,7,8,9 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "테스트만 하기 (체크하면 카드만 만들고 게시하지 않아요)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: weather-us
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 폰트 설치
        run: sudo apt-get update -y && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r requirements.txt
      - name: 카드 만들고 게시
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
          IG_USER_ID_US: ${{ secrets.IG_USER_ID_US }}
          IG_TOKEN_US: ${{ secrets.IG_TOKEN_US }}
          THREADS_USER_ID_US: ${{ secrets.THREADS_USER_ID_US }}
          THREADS_TOKEN_US: ${{ secrets.THREADS_TOKEN_US }}
        run: python run.py --region us --emit ${{ github.event_name == 'workflow_dispatch' && (inputs.dry_run && '--dry-run --force' || '--force') || '' }}
      - name: Threads 게시 (Make가 깨운 실행에서만)
        if: ${{ github.event_name == 'workflow_dispatch' && !inputs.dry_run }}
        env:
          THREADS_TOKEN_US: ${{ secrets.THREADS_TOKEN_US }}
        run: |
          python threads_post.py --region us
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "us threads posted" && git pull --rebase -q && git push -q)
      - name: 테스트 카드 보관 (dry-run일 때)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: card-us
          path: out/
