name: refresh-threads-token
on:
  schedule:
    - cron: "17 9 * * 1"   # 매주 월요일: Threads·Instagram 토큰을 60일씩 연장하고 비밀값을 새 토큰으로 교체
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 토큰 갱신
        env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
          TOKEN_KR: ${{ secrets.THREADS_TOKEN_KR }}
          TOKEN_US: ${{ secrets.THREADS_TOKEN_US }}
          IG_KR: ${{ secrets.IG_TOKEN_KR }}
          IG_US: ${{ secrets.IG_TOKEN_US }}
          REPO: ${{ github.repository }}
        run: |
          fail=0
          for R in KR US; do
            eval "old=\$TOKEN_$R"
            if [ -z "$old" ]; then echo "$R: 토큰 없음, 건너뜀"; continue; fi
            resp=$(curl -sS -G "https://graph.threads.net/refresh_access_token" \
              --data-urlencode "grant_type=th_refresh_token" \
              --data-urlencode "access_token=$old") || { echo "$R: 요청 실패"; fail=1; continue; }
            new=$(echo "$resp" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null)
            if [ -z "$new" ]; then echo "$R: 갱신 실패 (24시간이 안 지났거나 만료): $(echo "$resp" | head -c 200)"; fail=1; continue; fi
            echo "::add-mask::$new"
            printf '%s' "$new" | gh secret set "THREADS_TOKEN_$R" --repo "$REPO"
            echo "$R: 갱신 완료"
          done
          # Instagram(인스타 로그인 방식) 토큰도 같은 방식으로 60일 연장
          for R in KR US; do
            eval "old=\$IG_$R"
            if [ -z "$old" ]; then echo "IG $R: 토큰 없음, 건너뜀"; continue; fi
            case "$old" in EAA*) echo "IG $R: 만료 없는 시스템 사용자 토큰, 갱신 불필요"; continue;; esac
            resp=$(curl -sS -G "https://graph.instagram.com/refresh_access_token" \
              --data-urlencode "grant_type=ig_refresh_token" \
              --data-urlencode "access_token=$old") || { echo "IG $R: 요청 실패"; fail=1; continue; }
            new=$(echo "$resp" | python3 -c 'import sys,json; print(json.load(sys.stdin).get("access_token",""))' 2>/dev/null)
            if [ -z "$new" ]; then echo "IG $R: 갱신 실패: $(echo "$resp" | head -c 200)"; fail=1; continue; fi
            echo "::add-mask::$new"
            printf '%s' "$new" | gh secret set "IG_TOKEN_$R" --repo "$REPO"
            echo "IG $R: 갱신 완료"
          done
          exit $fail
