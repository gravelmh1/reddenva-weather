name: test-deriv-kr (임시, 게시 안 함)
on:
  push:
    branches: [claude/project-thread-y60idw]
    paths: [deriv_kr.py, .github/workflows/test-deriv-kr.yml]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: sudo apt-get update -y && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r requirements.txt matplotlib numpy
      - run: python deriv_kr.py --dry-run --force
      - uses: actions/upload-artifact@v4
        with: {name: deriv-kr-test, path: "out/deriv-kr-*.jpg"}
