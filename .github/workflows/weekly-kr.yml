name: weekly-kr
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "테스트만 하기 (체크하면 카드만 만들고 게시하지 않아요)"
        type: boolean
        default: true
permissions:
  contents: write
concurrency:
  group: weekly-kr
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 폰트 설치
        run: sudo apt-get update -y && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r requirements.txt
      - name: 책 카드 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: python books.py --region kr ${{ inputs.dry_run && '--dry-run --force' || '' }}
      - name: 뉴스 카드 만들기 (화요일에만 실제 실행)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news.py --region kr ${{ inputs.dry_run && '--dry-run --force' || '' }}
      - name: 오늘 카드 한 파일로 모으기
        if: ${{ !inputs.dry_run }}
        run: |
          python weekly_latest.py kr
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add out
          git diff --cached --quiet || (git commit -m "weekly kr latest" && git pull --rebase -q && git push -q)
      - name: Threads 게시
        if: ${{ !inputs.dry_run }}
        env:
          THREADS_TOKEN_KR: ${{ secrets.THREADS_TOKEN_KR }}
        run: |
          python threads_post.py --region kr --kind books-
          python threads_post.py --region kr --kind news-
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add state
          git diff --cached --quiet || (git commit -m "books kr threads posted" && git pull --rebase -q && git push -q)
      - name: 테스트 카드 보관 (dry-run일 때)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: weekly-card-kr
          path: out/*.jpg
