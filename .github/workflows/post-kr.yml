name: post-kr
# Make가 깨우는 단 하나의 워크플로. 아침에는 날씨, 낮 12~13시대에는 주간 카드(월 책, 화 좋은 뉴스, 수 아기 동물, 목 파생 브리핑, 금 주말 여행)를 만들고
# out/kr-post.json 에 "지금 올릴 카드"를 적어 둔다. ig=true로 깨우면 Instagram도 여기서 직접 올리고(Make 1크레딧), 아니면 예전처럼 Make가 3분 20초 뒤 그 파일을 읽어 올린다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "테스트만 하기 (체크하면 카드만 만들고 게시하지 않아요)"
        type: boolean
        default: true
      slot:
        description: "auto(현지 시각으로 자동) / weather / weekly / morning(모닝 브리프) / close(마감 브리프) / wrap(토 주간 정리) / ahead(일 다음 주 일정)"
        type: string
        default: auto
      ig:
        description: "Instagram도 여기서 직접 올리기 (Make가 true로 깨우면 Make는 게시하지 않음)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: post-kr
  cancel-in-progress: false
jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 어떤 카드 차례인지 정하기
        id: slot
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          if [ "${{ inputs.slot }}" = "weather" ] || [ "${{ inputs.slot }}" = "weekly" ] || [ "${{ inputs.slot }}" = "morning" ] || [ "${{ inputs.slot }}" = "close" ] || [ "${{ inputs.slot }}" = "wrap" ] || [ "${{ inputs.slot }}" = "ahead" ]; then echo "slot=${{ inputs.slot }}" >> "$GITHUB_OUTPUT"; else python post_slot.py kr >> "$GITHUB_OUTPUT"; fi
          cat "$GITHUB_OUTPUT"
      - name: (주간·브리프) 시작할 때 post.json 비우기
        if: ${{ (steps.slot.outputs.slot == 'weekly' || steps.slot.outputs.slot == 'morning' || steps.slot.outputs.slot == 'close' || steps.slot.outputs.slot == 'wrap' || steps.slot.outputs.slot == 'ahead') && !inputs.dry_run }}
        run: |
          python post_slot.py kr --clear
          git add out
          git diff --cached --quiet || (git commit -q -m "kr post cleared" && git pull --rebase -q && git push -q)
      - name: 폰트 설치
        run: sudo apt-get update -y && sudo apt-get install -y fonts-noto-cjk
      - run: pip install -r requirements.txt
      - name: (날씨) 카드 만들기
        if: ${{ steps.slot.outputs.slot == 'weather' }}
        env:
          OPEN_METEO_API_KEY: ${{ secrets.OPEN_METEO_API_KEY }}
        run: python run.py --region kr --emit ${{ inputs.dry_run && '--dry-run --force' || '--force' }}
      - name: (주간) 책 카드 만들기
        if: ${{ steps.slot.outputs.slot == 'weekly' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NYT_API_KEY: ${{ secrets.NYT_API_KEY }}
        run: python books.py --region kr ${{ inputs.dry_run && '--dry-run --force' || '' }}
      - name: (주간) 뉴스 카드 만들기
        if: ${{ steps.slot.outputs.slot == 'weekly' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python news.py --region kr ${{ inputs.dry_run && '--dry-run --force' || '' }}
      - name: (주간) 파생 브리핑 카드 만들기 (목요일에만 실제 실행)
        if: ${{ steps.slot.outputs.slot == 'weekly' }}
        run: |
          pip install -q matplotlib numpy
          python deriv_kr.py ${{ inputs.dry_run && '--dry-run --force' || '' }}
      - name: (주간) 레드덴바의 동전 던지기 만들기 (수요일에만 실제 실행)
        if: ${{ steps.slot.outputs.slot == 'weekly' }}
        run: python dart.py --region kr ${{ inputs.dry_run && '--dry-run --force' || '' }}
      - name: (주간) 주말 여행 카드 만들기 (금요일에만 실제 실행)
        if: ${{ steps.slot.outputs.slot == 'weekly' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python trips.py --region kr ${{ inputs.dry_run && '--dry-run --force' || '' }}
      - name: (주간) 동물 상식 카드 만들기 (토요일에만 실제 실행)
        if: ${{ steps.slot.outputs.slot == 'weekly' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: python facts.py --region kr ${{ inputs.dry_run && '--dry-run --force' || '' }}
      - name: (주간) 넷플릭스 카드 만들기 (일요일에만 실제 실행)
        if: ${{ steps.slot.outputs.slot == 'weekly' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python netflix.py --region kr ${{ inputs.dry_run && '--dry-run --force' || '' }}
      - name: (브리프) 모닝·마감 브리프 카드 만들기 (장 쉬는 날은 건너뜀)
        if: ${{ steps.slot.outputs.slot == 'morning' || steps.slot.outputs.slot == 'close' || steps.slot.outputs.slot == 'wrap' || steps.slot.outputs.slot == 'ahead' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          pip install -q playwright
          export CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          [ -n "$CHROME_PATH" ] || python -m playwright install --with-deps chromium
          python brief.py --region kr --kind ${{ steps.slot.outputs.slot }} ${{ inputs.dry_run && '--dry-run --force' || '' }}
      - name: Make가 읽을 파일(post.json) 쓰기
        if: ${{ always() && !inputs.dry_run && steps.slot.outputs.slot != '' }}
        run: |
          git pull --rebase -q || true
          python post_slot.py kr --write ${{ steps.slot.outputs.slot }}
          python feed.py kr || true
          git add out
          git diff --cached --quiet || (git commit -q -m "kr post.json" && git pull --rebase -q && git push -q)
      - name: (릴스) 영상 만들기 (reels.json에서 켠 지역만. 실패하면 그냥 카드 이미지로 게시)
        if: ${{ always() && inputs.ig && !inputs.dry_run && steps.slot.outputs.slot != '' }}
        continue-on-error: true
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if python reel.py --region kr --enabled; then
            pip install -q playwright imageio-ffmpeg
            # 러너에 이미 깔린 Chrome을 쓰면 브라우저 설치(수 분)를 건너뛴다. 없을 때만 설치
            CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
            if [ -n "$CHROME_PATH" ] && CHROME_PATH="$CHROME_PATH" python reel.py --region kr; then exit 0; fi
            python -m playwright install --with-deps chromium && python reel.py --region kr
          else echo "릴스 꺼짐 → 카드 이미지로 게시"; fi
      - name: (브리프) 블로그에 글이 뜰 때까지 기다리기 — 프로필 링크 눌렀을 때 바로 보이게 (최대 8분, 안 뜨면 그냥 게시)
        if: ${{ !inputs.dry_run && (steps.slot.outputs.slot == 'morning' || steps.slot.outputs.slot == 'close' || steps.slot.outputs.slot == 'wrap' || steps.slot.outputs.slot == 'ahead') }}
        run: |
          D=$(TZ=Asia/Seoul date +%F)
          case "${{ steps.slot.outputs.slot }}" in close) SUB=closing/ ;; wrap|ahead) SUB=weekend/ ;; *) SUB= ;; esac
          [ -f out/${{ steps.slot.outputs.slot }}-kr-latest.json ] && grep -q "\"$D\"" out/${{ steps.slot.outputs.slot }}-kr-latest.json || { echo "오늘 카드 없음 → 안 기다림"; exit 0; }
          URL="https://red-denva-market-brief-kr.vercel.app/briefs/$D/$SUB"
          for i in $(seq 1 32); do
            if curl -fsSL "$URL?t=$(date +%s)" 2>/dev/null | grep -q 'reddenva-weather brief'; then echo "블로그 확인: $URL"; exit 0; fi
            sleep 15
          done
          echo "::warning::블로그에 아직 없음 ($URL) → 그냥 게시"
      - name: Instagram 게시 (ig=true일 때)
        if: ${{ always() && inputs.ig && !inputs.dry_run && steps.slot.outputs.slot != '' }}
        env:
          IG_TOKEN_KR: ${{ secrets.IG_TOKEN_KR }}
        run: |
          git pull --rebase -q || true
          python ig_post.py --region kr --slot ${{ steps.slot.outputs.slot }}
          git add state
          git diff --cached --quiet || (git commit -q -m "kr instagram posted" && git pull --rebase -q && git push -q)
      - name: Threads 게시
        if: ${{ !inputs.dry_run }}
        env:
          THREADS_TOKEN_KR: ${{ secrets.THREADS_TOKEN_KR }}
        run: |
          if [ "${{ steps.slot.outputs.slot }}" = "morning" ] || [ "${{ steps.slot.outputs.slot }}" = "close" ] || [ "${{ steps.slot.outputs.slot }}" = "wrap" ] || [ "${{ steps.slot.outputs.slot }}" = "ahead" ]; then python threads_post.py --region kr --kind ${{ steps.slot.outputs.slot }}-;
          elif [ "${{ steps.slot.outputs.slot }}" = "weather" ]; then python threads_post.py --region kr; else python threads_post.py --region kr --kind books-; python threads_post.py --region kr --kind news-; python threads_post.py --region kr --kind dart-; python threads_post.py --region kr --kind puppy-; python threads_post.py --region kr --kind deriv-; python threads_post.py --region kr --kind trip-; python threads_post.py --region kr --kind facts-; python threads_post.py --region kr --kind netflix-; fi
          git add state
          git diff --cached --quiet || (git commit -q -m "kr threads posted" && git pull --rebase -q && git push -q)
      - name: (릴스) 테스트 영상 만들기 (dry-run일 때, 게시 안 함)
        if: ${{ inputs.dry_run }}
        continue-on-error: true
        run: |
          pip install -q playwright imageio-ffmpeg && python -m playwright install --with-deps chromium
          python reel.py --region kr --preview
      - name: 테스트 영상 보관 (dry-run일 때)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: reel-preview-kr
          path: reel_out/*
          if-no-files-found: ignore
      - name: 테스트 카드 보관 (dry-run일 때)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: post-card-kr
          path: out/*.jpg
