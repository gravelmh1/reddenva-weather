name: puppy-test
# 수요일 아기 동물 시험: 게시하지 않고 카드(+영상 버전 릴스)만 만들어 samples 브랜치 puppy/ 폴더에 올린다
on:
  workflow_dispatch:
    inputs:
      video:
        description: "영상 버전(Pexels 아기 동물 영상)으로 시험"
        type: boolean
        default: true
      day:
        description: "이 날짜인 척 (비우면 오늘)"
        default: ""
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update -y && sudo apt-get install -y fonts-noto-cjk fonts-noto-color-emoji
      - run: pip install -r requirements.txt playwright imageio-ffmpeg
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        run: |
          D="${{ inputs.day }}"; OPT="--dry-run --force ${D:+--day $D} ${{ inputs.video && '--video' || '' }}"
          python animals.py --region kr $OPT
          python animals.py --region us $OPT
      - name: 수요일 다트 투자 샘플 (지난 4주를 과거 시세로 채운 데모, 저장·게시 안 함)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          D="${{ inputs.day }}"
          python dart.py --region kr --dry-run --force ${D:+--day $D} --demo 4
          python dart.py --region us --dry-run --force ${D:+--day $D} --demo 4
      - name: 릴스 렌더 (러너의 Chrome 사용)
        env:
          CHROME_PATH: /usr/bin/google-chrome
        run: |
          mkdir -p samples/puppy
          python reel.py --region kr --kind puppy --local samples/puppy/reel-puppy-kr.mp4
          python reel.py --region us --kind puppy --local samples/puppy/reel-puppy-us.mp4
          python reel.py --region kr --kind dart --local samples/puppy/reel-dart-kr.mp4 || true
          python reel.py --region us --kind dart --local samples/puppy/reel-dart-us.mp4 || true
          cp out/puppy-*.jpg samples/puppy/; cp out/dart-*.jpg samples/puppy/ || true
      - name: samples 브랜치에 저장
        run: |
          mkdir /tmp/s && cp -r samples/puppy /tmp/s/
          git config user.name "github-actions"; git config user.email "actions@users.noreply.github.com"
          git fetch origin samples || true
          git checkout -f -B samples origin/samples
          git rm -rq --cached . 2>/dev/null || true
          rm -rf puppy && cp -r /tmp/s/puppy puppy && git add puppy && git commit -qm "puppy samples" && git push -q origin samples
