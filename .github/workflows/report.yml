name: weekly-report
# 주간 성적표: Instagram·Threads 게시물 반응을 읽어서 reports/latest.md 를 만든다. 읽기만 하고 게시는 안 함. Make와 무관.
on:
  schedule:
    - cron: "0 17 * * 1"   # 매주 월요일 17:00 UTC (= LA 월 09:00, 한국 화 02:00). 늦게 돌아도 상관없음
  workflow_dispatch:
  push:
    branches: [claude/project-thread-xcdqy5]   # PR 확인용 첫 실행. 합치기 전에 지움
    paths: [report.py, .github/workflows/report.yml]
permissions:
  contents: write
concurrency:
  group: weekly-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 성적표 만들기
        env:
          IG_TOKEN_KR: ${{ secrets.IG_TOKEN_KR }}
          IG_TOKEN_US: ${{ secrets.IG_TOKEN_US }}
          THREADS_TOKEN_KR: ${{ secrets.THREADS_TOKEN_KR }}
          THREADS_TOKEN_US: ${{ secrets.THREADS_TOKEN_US }}
        run: python report.py
      - name: 저장
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add reports
          git diff --cached --quiet || (git commit -q -m "weekly report" && git pull --rebase -q && git push -q)
