name: animals-sample
# 수요일 아기 동물 시리즈 시안용: 사진 후보를 받아 samples 브랜치에 올린다 (게시하지 않음)
on:
  workflow_dispatch:
    inputs:
      queries:
        description: "검색어 (| 로 구분)"
        type: string
        default: ""
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - env:
          Q: ${{ inputs.queries }}
        run: python animals_fetch.py
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan samples-tmp
          git rm -rq --cached . 
          git add -f samples
          git commit -q -m "animal photo candidates"
          git push -q -f origin samples-tmp:samples
