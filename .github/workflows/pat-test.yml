name: pat-test
on:
  push:
    branches: [claude/project-thread-mrai8l]
    paths: [.github/workflows/pat-test.yml]
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GH_SECRETS_PAT }}
        run: |
          gh api repos/gravelmh1/red-denva-market-brief --jq '.full_name, .permissions' || echo "NO REPO ACCESS"
          gh api repos/gravelmh1/red-denva-market-brief/actions/workflows --jq '.workflows[].path' || echo "NO ACTIONS READ"
