name: ig-check
# 일회성 점검: Instagram 토큰이 두 계정에 접근되는지만 확인 (게시 안 함). 결과는 state/ig_check.txt (재점검 2)
on:
  push:
    paths: [".github/workflows/ig-check.yml"]
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 점검
        env:
          IG_TOKEN_KR: ${{ secrets.IG_TOKEN_KR }}
          IG_TOKEN_US: ${{ secrets.IG_TOKEN_US }}
        run: |
          python3 - <<'PY' > state/ig_check.txt
          import os, json, urllib.request, urllib.error, datetime
          ids = {"KR": "17841415970047103", "US": "17841468623391374"}
          print(datetime.datetime.utcnow().isoformat())
          for R, i in ids.items():
              t = os.environ.get(f"IG_TOKEN_{R}", "").strip()
              if not t: print(R, "토큰 없음"); continue
              base = "https://graph.facebook.com/v21.0" if t.startswith("EAA") else "https://graph.instagram.com/v21.0"
              path = f"{base}/{i}?fields=username,media_count" if t.startswith("EAA") else f"{base}/me?fields=user_id,username"
              req = urllib.request.Request(path, headers={"Authorization": f"Bearer {t}"})
              try:
                  print(R, t[:4], "OK", urllib.request.urlopen(req, timeout=30).read().decode()[:200])
              except urllib.error.HTTPError as e:
                  print(R, t[:4], "ERROR", e.code, e.read().decode()[:300])
              try:  # 게시 한도 조회 (게시 권한 확인용, 실제 게시 아님)
                  q = urllib.request.Request(f"{base}/{i}/content_publishing_limit?fields=quota_usage,config", headers={"Authorization": f"Bearer {t}"})
                  print(R, "publish-limit", urllib.request.urlopen(q, timeout=30).read().decode()[:200])
              except urllib.error.HTTPError as e:
                  print(R, "publish-limit ERROR", e.code, e.read().decode()[:300])
          PY
          cat state/ig_check.txt
          git config user.name github-actions; git config user.email actions@users.noreply.github.com
          git add state/ig_check.txt && git commit -q -m "ig check" && git pull --rebase -q && git push -q
