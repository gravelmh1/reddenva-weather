<!doctype html>
<html><head><meta charset="utf-8">
<!-- 릴스 장면 엔진. reel.py가 window.DATA = {theme, scenes:[...]} 를 넣고, render.py가 render(t)로 한 프레임씩 찍는다.
     장면 종류: open · hook · tiles · list · quote · photo · video · dart · week · chart · cards. 아래 1500px 밑은 릴스 캡션·버튼 자리라 비워둔다. -->
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1920px; overflow: hidden; }
  body { font-family: "Noto Sans CJK KR", "Noto Sans CJK JP", sans-serif; color: var(--fg); letter-spacing: -0.02em; background: var(--bg); }
  .scene { position: absolute; inset: 0; will-change: transform, opacity; }
  .col { position: absolute; left: 0; top: 230px; width: 1080px; display: flex; flex-direction: column; align-items: center; text-align: center; }
  [data-a] { will-change: transform, opacity; }
  .up { color: var(--up); } .dn { color: var(--dn); } .acc { color: var(--acc); }
  .kicker { font-size: 40px; font-weight: 700; color: var(--acc); letter-spacing: .02em; }
  .title { font-size: 74px; font-weight: 900; line-height: 1.18; max-width: 960px; margin-top: 8px; }
  .chip { display: inline-block; padding: 14px 34px; border-radius: 999px; background: var(--chip); font-size: 40px; font-weight: 500; color: var(--sub); }
  .label { font-size: 50px; font-weight: 700; color: var(--sub); }
  .big { font-size: 380px; font-weight: 900; letter-spacing: -0.06em; line-height: 1; }
  .big .suf { font-size: 240px; vertical-align: top; position: relative; top: 30px; }
  .hook { font-size: 120px; font-weight: 900; line-height: 1.14; letter-spacing: -0.04em; max-width: 1000px; }
  .hook.s { font-size: 96px; } .hook.xs { font-size: 80px; }
  .hsub { font-size: 50px; font-weight: 700; color: var(--sub); max-width: 940px; line-height: 1.3; }
  .pill { display: inline-flex; align-items: center; gap: 18px; padding: 26px 50px; border-radius: 999px; background: var(--pill); color: #fff;
          font-size: 64px; font-weight: 900; box-shadow: 0 20px 60px rgba(0,0,0,.3); max-width: 1000px; }
  .panel { background: var(--panel); color: var(--pfg); border-radius: 40px; box-shadow: var(--shadow); border: var(--pborder); }
  .tiles { display: grid; gap: 28px; width: 960px; }
  .tile { padding: 38px 42px; text-align: left; }
  .tile .l { font-size: 40px; font-weight: 700; color: var(--psub); }
  .tile .n { font-weight: 900; letter-spacing: -0.05em; line-height: 1.1; margin-top: 6px; }
  .tile .c { font-size: 40px; font-weight: 700; margin-top: 4px; }
  .rowp { width: 960px; display: flex; align-items: center; gap: 28px; padding: 28px 38px; text-align: left; }
  .rowp .tag { flex: none; padding: 10px 24px; border-radius: 18px; background: var(--tagbg); font-size: 36px; font-weight: 700; color: var(--tagfg); }
  .rowp .v { font-size: 42px; font-weight: 700; line-height: 1.3; }
  .item { width: 960px; display: flex; gap: 30px; padding: 34px 40px; text-align: left; align-items: flex-start; }
  .item .num { flex: none; width: 84px; height: 84px; border-radius: 50%; background: var(--acc); color: #fff; font-size: 48px; font-weight: 900;
               display: flex; align-items: center; justify-content: center; }
  .item .h { font-size: 50px; font-weight: 900; line-height: 1.25; }
  .item .s { font-size: 38px; font-weight: 500; color: var(--psub); line-height: 1.4; margin-top: 10px; }
  .item .tagl { font-size: 32px; font-weight: 700; color: var(--acc); margin-bottom: 6px; }
  .quote { font-size: 70px; font-weight: 900; line-height: 1.32; max-width: 940px; }
  .by { font-size: 40px; font-weight: 500; color: var(--sub); }
  .photo { position: absolute; left: 40px; top: 150px; width: 1000px; height: 1010px; overflow: hidden; border-radius: 44px; box-shadow: 0 30px 90px rgba(0,0,0,.5); }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .photo .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.35) 0%, rgba(0,0,0,0) 18%); }
  .ptext { position: absolute; left: 60px; right: 60px; top: 1200px; color: var(--fg); text-align: left; }
  .ptext .badge { display: inline-block; padding: 12px 28px; border-radius: 999px; background: var(--acc); color: #fff; font-size: 36px; font-weight: 700; }
  .ptext .pt { font-size: 96px; font-weight: 900; line-height: 1.08; margin-top: 16px; letter-spacing: -0.04em; }
  .ptext .pl { font-size: 46px; font-weight: 700; line-height: 1.35; margin-top: 12px; color: var(--fg); }
  .ptext .pl + .pl { margin-top: 4px; }
  .ptop { position: absolute; left: 80px; top: 186px; color: #fff; font-size: 34px; font-weight: 700; text-shadow: 0 2px 10px rgba(0,0,0,.5); }
  .credit { position: absolute; left: 60px; right: 60px; top: 1172px; color: var(--sub); font-size: 24px; text-align: right; opacity: .8; }
  .vid { position: absolute; inset: 0; overflow: hidden; background: #000; }
  .vid img { position: absolute; inset: 0; width: 1080px; height: 1920px; object-fit: cover; }
  .vid .vs1 { position: absolute; left: 0; right: 0; top: 0; height: 420px; background: linear-gradient(180deg, rgba(0,0,0,.55), rgba(0,0,0,0)); }
  .vid .vs2 { position: absolute; left: 0; right: 0; bottom: 0; height: 1060px; background: linear-gradient(0deg, rgba(0,0,0,.78) 0%, rgba(0,0,0,.62) 45%, rgba(0,0,0,0) 100%); }
  .vtop { position: absolute; left: 60px; right: 60px; top: 150px; display: flex; align-items: center; gap: 20px; color: #fff; font-size: 36px; font-weight: 700; text-shadow: 0 2px 12px rgba(0,0,0,.5); }
  .vtop .vd { flex: none; width: 96px; border-radius: 20px; overflow: hidden; background: #fff; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.35); text-shadow: none; }
  .vtop .vd b { display: block; background: #e0482a; color: #fff; font-size: 22px; padding: 4px 0 3px; }
  .vtop .vd i { display: block; font-style: normal; color: #14284d; font-size: 54px; font-weight: 900; line-height: 1.1; letter-spacing: -0.04em; padding-bottom: 4px; }
  .vtext { position: absolute; left: 64px; right: 64px; bottom: 470px; color: #fff; text-align: left; text-shadow: 0 3px 18px rgba(0,0,0,.45); }
  .vtext .badge { display: inline-block; padding: 12px 30px; border-radius: 999px; background: var(--acc); color: #3a1a10; font-size: 38px; font-weight: 900; text-shadow: none; }
  .vtext .vt { font-size: 112px; font-weight: 900; line-height: 1.05; margin-top: 20px; letter-spacing: -0.045em; }
  .vtext .vl { font-size: 56px; font-weight: 700; line-height: 1.32; margin-top: 22px; }
  .vtext .vl + .vl { margin-top: 6px; }
  .vtext .vt.s { font-size: 92px; } .vtext .vt.xs { font-size: 76px; }
  .vcredit { position: absolute; left: 64px; right: 64px; top: 1478px; color: rgba(255,255,255,.62); font-size: 24px; text-align: right; text-shadow: 0 1px 6px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; width: 980px; margin-top: 50px; }
  .dchip { height: 104px; border-radius: 22px; background: var(--chip); color: var(--fg); font-size: 29px; font-weight: 700; display: flex; align-items: center;
           justify-content: center; padding: 0 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
  .dgrid.dbig .dchip { height: 168px; font-size: 52px; font-weight: 900; border-radius: 30px; }
  .dchip .up { color: var(--up); } .dchip .dn { color: var(--dn); }
  .dchip.on .up, .dchip.on .dn, .dchip.hit .up, .dchip.hit .dn { color: inherit; }
  .hook.xl { font-size: 220px; letter-spacing: -0.06em; }
  .dchip.on { background: var(--acc); color: #2a1a10; transform: scale(1.06); }
  .dchip.hit { background: #e0482a; color: #fff; transform: scale(1.12); box-shadow: 0 16px 40px rgba(0,0,0,.4); }
  .dart { position: absolute; left: 0; top: 0; width: 440px; height: 120px; opacity: 0; transform-origin: 0 50%; filter: drop-shadow(0 10px 14px rgba(0,0,0,.35)); }
  .wk { width: 960px; height: 760px; padding: 40px 18px; display: flex; }
  .wc { flex: 1; position: relative; text-align: center; border-radius: 30px; }
  .wc.today { background: var(--today); }
  .wc .d { font-size: 40px; font-weight: 700; margin-top: 10px; }
  .wc .ic { font-family: "Noto Color Emoji"; font-size: 62px; margin-top: 18px; display: block; }
  .wc .bar { position: absolute; left: 50%; width: 30px; margin-left: -15px; border-radius: 15px; transform-origin: 50% 50%; }
  .wc .hi, .wc .lo { position: absolute; width: 100%; font-size: 36px; font-weight: 700; }
  .wc .hi { color: var(--up); } .wc .lo { color: var(--dn); }
  .chart { width: 960px; height: 720px; position: relative; }
  .chart .lab { position: absolute; font-size: 30px; color: var(--psub); }
  .chart .endlab { position: absolute; font-weight: 900; font-size: 50px; white-space: nowrap; }
  .legend { position: absolute; top: 30px; left: 40px; right: 40px; font-size: 30px; font-weight: 700; color: var(--psub); display: flex; gap: 30px; flex-wrap: wrap; }
  .legend i { display: inline-block; width: 40px; height: 8px; border-radius: 4px; vertical-align: middle; margin-right: 10px; }
  .foot { font-size: 30px; color: var(--sub); opacity: .85; }
  .cardwrap { width: 1000px; height: 1250px; overflow: hidden; border-radius: 36px; box-shadow: 0 30px 90px rgba(0,0,0,.45); }
  .strip { display: flex; }
  .strip img { width: 1000px; height: 1250px; display: block; }
  .dtile { width: 300px; border-radius: 40px; overflow: hidden; background: #fff; box-shadow: 0 24px 70px rgba(0,0,0,.35); text-align: center; }
  .dtile .band { background: #e0482a; color: #fff; font-size: 58px; font-weight: 900; padding: 16px 0 14px; letter-spacing: .02em; }
  .dtile .day { color: #14284d; font-size: 210px; font-weight: 900; line-height: 1.08; letter-spacing: -0.06em; padding: 4px 0 18px; }
  .otitle { font-size: 156px; font-weight: 900; line-height: 1.06; letter-spacing: -0.05em; max-width: 1020px; }
  .otitle.s { font-size: 124px; }
  .ohandle { font-size: 44px; font-weight: 700; color: var(--sub); letter-spacing: .02em; }
  .brow { width: 960px; display: grid; grid-template-columns: 1fr auto 230px; align-items: center; gap: 26px; padding: 26px 36px; text-align: left; }
  .brow .bn { font-size: 46px; font-weight: 900; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brow .bv { font-size: 34px; font-weight: 500; color: var(--psub); margin-top: 2px; }
  .brow .bc { font-size: 60px; font-weight: 900; letter-spacing: -0.04em; text-align: right; font-variant-numeric: tabular-nums; }
  .hgrid { display: grid; gap: 16px; width: 960px; }
  .hcell { border-radius: 28px; padding: 26px 10px; color: #fff; text-align: center; box-shadow: 0 14px 40px rgba(0,0,0,.25); }
  .hcell .hn { font-size: 34px; font-weight: 700; opacity: .95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hcell .hc { font-size: 54px; font-weight: 900; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; }
  .hsec { font-size: 40px; font-weight: 900; width: 960px; text-align: left; margin: 44px 0 18px; color: var(--fg); }
  .frow { width: 960px; padding: 34px 40px; text-align: left; }
  .frow .ft { font-size: 44px; font-weight: 900; margin-bottom: 18px; }
  .fline { display: grid; grid-template-columns: 150px 1fr 230px; align-items: center; gap: 22px; height: 92px; }
  .fline .fw { font-size: 40px; font-weight: 700; color: var(--psub); }
  .fline .fb { position: relative; height: 44px; }
  .fline .fb::before { content: ""; position: absolute; left: 50%; top: -10px; bottom: -10px; width: 3px; background: rgba(128,128,128,.35); }
  .fline .fbar { position: absolute; top: 0; height: 44px; border-radius: 12px; }
  .fline .fv { font-size: 52px; font-weight: 900; text-align: right; font-variant-numeric: tabular-nums; }
  img.pose { display: block; filter: drop-shadow(0 18px 30px rgba(0,0,0,.3)); }
  #fx { position: absolute; inset: 0; pointer-events: none; }
  .flake { position: absolute; border-radius: 50%; background: #dfe9ff; }
</style></head>
<body>
<div id="fx"></div>
<div id="stage"></div>
<script src="lib.js"></script>
<script>
const D = window.DATA, TH = D.theme;
for (const k in TH.vars) document.documentElement.style.setProperty("--" + k, TH.vars[k]);
const POSE = n => `../assets/poses/${n}.png`;
const A = (a, d, extra = "") => `data-a="${a}" data-d="${d}" ${extra}`;
const poseImg = (p, h, d) => p ? `<div ${A("pose", d)} style="margin-top:40px"><img class="pose" src="${POSE(p)}" height="${h}"></div>` : "";
const head = (s, d = 0) => (s.kicker ? `<div class="kicker" ${A("rise", d)}>${rich(s.kicker)}</div>` : "") + (s.title ? `<div class="title" ${A("rise", d + .08)}>${rich(s.title)}</div>` : "");
const cnt = (n, dp, sign, d, dur = 1.0, from = 0) => `<span data-count="${from},${n},${dp || 0},${sign ? 1 : 0},${d},${dur}">${fmtNum(n, dp || 0, sign)}</span>`;

function sparkSvg(v, c, w, h, base, d) {
  if (!v || v.length < 2) return `<svg width="${w}" height="${h}"></svg>`;
  const all = v.concat(base != null ? [base] : []); let lo = Math.min(...all), hi = Math.max(...all); if (hi - lo < 1e-9) { hi += 1; lo -= 1; }
  const X = i => 6 + (w - 12) * i / (v.length - 1), Y = y => 8 + (h - 16) * (hi - y) / (hi - lo);
  const p = v.map((y, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(y).toFixed(1)).join("");
  return `<svg width="${w}" height="${h}" style="overflow:visible">${base != null ? `<line x1="6" x2="${w - 6}" y1="${Y(base)}" y2="${Y(base)}" stroke="rgba(128,128,128,.45)" stroke-width="2.5" stroke-dasharray="6 8"/>` : ""}
    <path d="${p}" fill="none" stroke="${c}" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" data-draw="${d},0.9"/></svg>`;
}
const T = {
  open(s) {  // 첫 화면 = 섬네일: 날짜 아이콘 + 시리즈 제목을 크게 (인스타 격자 3:4 안쪽에 들어가게 가운데)
    let h = `<div class="col" style="top:${s.top || 300}px">`;
    h += `<div class="dtile" ${A("pop", 0)}><div class="band" style="white-space:nowrap;font-size:${s.band.length > 6 ? 46 : 58}px">${esc(s.band)}</div><div class="day">${esc(s.day)}</div></div>`;
    (s.lines || []).forEach((ln, i) => { h += `<div class="otitle ${s.size || ""}" ${A("word", .2 + i * .22)} style="margin-top:${i ? 0 : 64}px">${rich(ln)}</div>`; });
    if (s.handle) h += `<div class="ohandle" ${A("fade", .7)} style="margin-top:40px">${esc(s.handle)}</div>`;
    return h + poseImg(s.pose, s.poseh || 250, .55) + "</div>";
  },
  hook(s) {
    let h = `<div class="col" style="top:${s.top || 250}px">`;
    if (s.chip) h += `<div ${A("drop", 0)}><span class="chip">${rich(s.chip)}</span></div>`;
    if (s.kicker) h += `<div class="kicker" ${A("rise", 0)} style="margin-top:20px">${rich(s.kicker)}</div>`;
    if (s.label) h += `<div class="label" ${A("rise", .15)} style="margin-top:${s.chip ? 120 : 40}px">${rich(s.label)}</div>`;
    if (s.big) h += `<div class="big" ${A("big", .2)} style="margin-top:20px;${s.bigc ? "color:" + s.bigc : ""}">${cnt(s.big.to, s.big.dp, s.big.sign, .45, 1.0, s.big.from)}<span class="suf">${esc(s.big.suf || "")}</span></div>`;
    (s.lines || []).forEach((ln, i) => { h += `<div class="hook ${s.size || ""}" ${A("word", .2 + i * .3)} style="margin-top:${i ? 10 : 70}px">${rich(ln)}</div>`; });
    if (s.sub) h += `<div class="hsub" ${A("rise", .3 + (s.lines || []).length * .3)} style="margin-top:36px">${rich(s.sub)}</div>`;
    if (s.pill) h += `<div ${A("pop", s.big ? 1.45 : .9)} style="margin-top:40px"><span class="pill" style="${s.pillc ? "background:" + s.pillc : ""}">${rich(s.pill)}</span></div>`;
    h += poseImg(s.pose, s.poseh || 330, s.big ? .5 : 1.0);
    return h + "</div>";
  },
  tiles(s) {
    const cols = s.cols || 2, nsz = s.nsz || (cols === 2 && s.tiles.length <= 2 ? 200 : 104);
    let h = `<div class="col">${head(s)}<div class="tiles" style="grid-template-columns:repeat(${cols},1fr);margin-top:60px">`;
    s.tiles.forEach((t, i) => {
      const v = typeof t.n === "number" ? cnt(t.n, t.dp, t.sign, .4 + i * .14) : esc(t.v);
      h += `<div class="panel tile" ${A("tile", .25 + i * .14)}><div class="l">${rich(t.l)}</div>
        <div class="n" style="font-size:${nsz}px;color:${t.vc || "inherit"}">${esc(t.pre || "")}${v}${esc(t.suf || "")}</div>
        ${t.c ? `<div class="c" style="color:${t.cc || "var(--psub)"}">${rich(t.c)}</div>` : ""}</div>`;
    });
    h += "</div>";
    (s.rows || []).forEach((r, i) => { h += `<div class="panel rowp" ${A("left", .9 + i * .22)} style="margin-top:24px"><span class="tag">${rich(r[0])}</span><span class="v">${rich(r[1])}</span></div>`; });
    if (s.foot) h += `<div class="foot" ${A("fade", .8)} style="margin-top:28px">${rich(s.foot)}</div>`;
    return h + poseImg(s.pose, s.poseh || 250, 1.2) + "</div>";
  },
  list(s) {
    let h = `<div class="col">${head(s)}<div style="height:40px"></div>`;
    s.items.forEach((it, i) => {
      h += `<div class="panel item" ${A("left", .3 + i * (s.gap || .35))} style="margin-top:22px">
        ${it.num != null ? `<div class="num" style="${it.numc ? "background:" + it.numc : ""}">${esc(it.num)}</div>` : ""}
        <div>${it.tag ? `<div class="tagl">${rich(it.tag)}</div>` : ""}<div class="h">${rich(it.h)}</div>${it.s ? `<div class="s">${rich(it.s)}</div>` : ""}</div></div>`;
    });
    if (s.foot) h += `<div class="foot" ${A("fade", 1)} style="margin-top:28px">${rich(s.foot)}</div>`;
    return h + poseImg(s.pose, s.poseh || 230, .3 + s.items.length * (s.gap || .35)) + "</div>";
  },
  quote(s) {
    return `<div class="col" style="top:420px">${head(s)}
      <div class="quote" ${A("rise", .35)} style="margin-top:70px">${rich(s.text)}</div>
      ${s.by ? `<div class="by" ${A("fade", .9)} style="margin-top:40px">${rich(s.by)}</div>` : ""}
      ${poseImg(s.pose, s.poseh || 300, 1.0)}</div>`;
  },
  photo(s) {
    return `<div class="photo" ${A("card", 0)}><img src="${s.src}" data-kb="${s.fx ?? .5},${s.fy ?? .5}" style="object-position:${(s.fx ?? .5) * 100}% ${(s.fy ?? .5) * 100}%"><div class="shade"></div></div>
      ${s.top ? `<div class="ptop" ${A("fade", .1)}>${esc(s.top)}</div>` : ""}
      <div class="ptext">${s.badge ? `<span class="badge" ${A("pop", .25)}>${rich(s.badge)}</span>` : ""}
        ${s.title ? `<div class="pt" ${A("rise", .45)}>${rich(s.title)}</div>` : ""}
        ${(s.lines || []).map((l, i) => `<div class="pl" ${A("rise", .8 + i * .45)}>${rich(l)}</div>`).join("")}</div>
      ${s.credit ? `<div class="credit" ${A("fade", .6)}>${esc(s.credit)}</div>` : ""}`;
  },
  video(s) {  // 영상 꽉 채우기 + 아래쪽에 이름·두 줄 (프레임은 reel.py가 미리 뽑아 둔 JPG를 한 장씩 갈아 끼움)
    return `<div class="vid"><img src="${s.frames}/f0001.jpg"><div class="vs1"></div><div class="vs2"></div></div>
      <div class="vtop" ${A("drop", .1)}>${s.dnum ? `<div class="vd"><b>${esc(s.dband)}</b><i>${esc(s.dnum)}</i></div>` : ""}<span>${esc(s.top || "")}</span></div>
      <div class="vtext">${s.badge ? `<span class="badge" ${A("pop", .35)}>${rich(s.badge)}</span>` : ""}
        ${s.title ? `<div class="vt ${s.title.length > 13 ? "xs" : s.title.length > 9 ? "s" : ""}" ${A("rise", .6)}>${rich(s.title)}</div>` : ""}
        ${(s.lines || []).map((l, i) => `<div class="vl" ${A("rise", (s.lat || [1.6, 3.4])[i] ?? 1.6 + i * 1.8)}>${rich(l)}</div>`).join("")}</div>
      ${s.credit ? `<div class="vcredit" ${A("fade", .8)}>${esc(s.credit)}</div>` : ""}`;
  },
  dart(s) {  // 종목판에서 불빛이 돌다가 멈추고, 그 칸에 다트가 꽂힌다
    return `<div class="col" style="top:${s.top || 200}px">${head(s)}<div class="dgrid ${s.big ? "dbig" : ""}" style="${s.cols ? `grid-template-columns:repeat(${s.cols},1fr)` : ""}">${s.names.map(n => `<div class="dchip">${rich(n)}</div>`).join("")}</div></div>
      <svg class="dart" viewBox="0 0 220 60"><line x1="10" y1="30" x2="170" y2="30" stroke="#ffffff" stroke-width="11" stroke-linecap="round"/>
        <polygon points="0,30 24,21 24,39" fill="#cfd6e4"/><polygon points="150,30 215,4 196,30 215,56" fill="#ff8a4c"/></svg>`;
  },
  week(s) {
    const W = s.days, lo = Math.min(...W.map(w => w.lo)) - 1, hi = Math.max(...W.map(w => w.hi)) + 1;
    const Y0 = 210, HH = 380, y = v => Y0 + HH * (hi - v) / (hi - lo);
    let h = `<div class="col">${head(s)}<div class="panel wk" ${A("rise", .1)} style="margin-top:60px">`;
    W.forEach((w, i) => {
      const d = .45 + i * .12;
      h += `<div class="wc ${w.today ? "today" : ""}"><div class="d" ${A("fade", d - .1)} style="color:${w.c || "inherit"}">${esc(w.d)}</div>
        <span class="ic" ${A("pop", d)}>${w.ic}</span>
        <div class="hi" ${A("fade", d + .4)} style="top:${y(w.hi) - 54}px">${w.hi}°</div>
        <div class="bar" ${A("grow", d + .1)} style="top:${y(w.hi)}px;height:${Math.max(8, y(w.lo) - y(w.hi))}px;background:${w.today ? "linear-gradient(#ff9a6b,#ff7a45)" : w.faded ? "#c9ced8" : "linear-gradient(#ffb48f,#9cc0ff)"}"></div>
        <div class="lo" ${A("fade", d + .4)} style="top:${y(w.lo) + 8}px">${w.lo}°</div></div>`;
    });
    return h + "</div></div>";
  },
  chart(s) {
    const id = "ch" + s.i;
    let h = `<div class="col">${head(s)}<div class="panel chart" id="${id}" ${A("rise", .1)} style="margin-top:60px">
      <div class="legend">${s.series.map(x => `<span><i style="background:${x.c}"></i>${esc(x.name)}</span>`).join("")}${s.unit ? `<span style="opacity:.7">${esc(s.unit)}</span>` : ""}</div>
      <svg width="960" height="720" style="position:absolute;left:0;top:0"></svg></div>`;
    if (s.foot) h += `<div class="foot" ${A("fade", .5)} style="margin-top:28px${s.footbig ? ";font-size:44px;font-weight:700;opacity:1;color:var(--fg)" : ""}">${rich(s.foot)}</div>`;
    return h + "</div>";
  },
  board(s) {  // 시세판: 이름 · 값 · 등락률(숫자 올라감) · 미니 차트(그려짐)
    let h = `<div class="col" style="top:${s.top || 230}px">${head(s)}<div style="height:30px"></div>`;
    s.rows.forEach((r, i) => {
      const d = .3 + i * (s.gap || .22);
      h += `<div class="panel brow" ${A("left", d)} style="margin-top:18px"><div><div class="bn">${rich(r.n)}</div><div class="bv">${esc(r.v)}</div></div>
        <div class="bc" style="color:${r.c}">${r.p != null ? cnt(r.p, 2, true, d + .2, .8) + "%" : esc(r.ptxt || "")}</div>
        ${sparkSvg(r.spark, r.c, 230, 96, r.base, d + .15)}</div>`;
    });
    if (s.foot) h += `<div class="foot" ${A("fade", .8)} style="margin-top:28px">${rich(s.foot)}</div>`;
    return h + poseImg(s.pose, s.poseh || 220, .4 + s.rows.length * (s.gap || .22)) + "</div>";
  },
  heat(s) {  // 색 칸: 섹터·종목 등락률
    let h = `<div class="col" style="top:${s.top || 230}px">${head(s)}`, k = 0;
    (s.groups || [{ items: s.items, cols: s.cols }]).forEach(g => {
      if (g.title) h += `<div class="hsec" ${A("fade", .15 + k * .05)}>${rich(g.title)}</div>`; else h += `<div style="height:50px"></div>`;
      h += `<div class="hgrid" style="grid-template-columns:repeat(${g.cols || 3},1fr)">`;
      g.items.forEach(it => { const d = .3 + k++ * .07; h += `<div class="hcell" ${A("pop", d)} style="background:${it.bg}"><div class="hn">${esc(it.n)}</div><div class="hc">${cnt(it.p, 2, true, d + .1, .7)}%</div></div>`; });
      h += `</div>`;
    });
    if (s.foot) h += `<div class="foot" ${A("fade", .9)} style="margin-top:28px">${rich(s.foot)}</div>`;
    return h + "</div>";
  },
  flows(s) {  // 투자자별 순매수: 가운데 0에서 좌우로 자라는 막대
    let h = `<div class="col" style="top:${s.top || 260}px">${head(s)}<div style="height:30px"></div>`;
    s.groups.forEach((g, gi) => {
      const mx = Math.max(...g.rows.map(r => Math.abs(r.v)), 1);
      h += `<div class="panel frow" ${A("rise", .2 + gi * .5)} style="margin-top:26px"><div class="ft">${rich(g.title)}</div>`;
      g.rows.forEach((r, i) => {
        const d = .45 + gi * .5 + i * .15, w = 48 * Math.abs(r.v) / mx;
        h += `<div class="fline"><div class="fw">${esc(r.n)}</div><div class="fb"><div class="fbar" ${A("growx", d)} style="background:${r.c};width:${w}%;${r.v >= 0 ? "left:50%;transform-origin:0 50%" : "right:50%;transform-origin:100% 50%"}"></div></div>
          <div class="fv" style="color:${r.c}">${cnt(r.v, 0, true, d, .9)}</div></div>`;
      });
      h += `</div>`;
    });
    if (s.foot) h += `<div class="foot" ${A("fade", 1)} style="margin-top:28px">${rich(s.foot)}</div>`;
    return h + poseImg(s.pose, s.poseh || 220, 1.3) + "</div>";
  },
  cards(s) {
    return `<div class="col" style="top:120px"><div class="kicker" ${A("rise", 0)}>${rich(s.kicker || "")}</div>
      <div class="cardwrap" ${A("card", 0)} style="margin-top:30px"><div class="strip" style="width:${1000 * s.srcs.length}px">${s.srcs.map(u => `<img src="${u}">`).join("")}</div></div></div>`;
  },
};

// 장면 만들기 + 시작 시각
let t0 = 0;
const S = D.scenes.map((s, i) => {
  s.i = i; s.start = t0; t0 += s.dur;
  const el = document.createElement("div"); el.className = "scene"; el.innerHTML = T[s.type](s);
  if (s.bg) el.style.background = s.bg;
  $("#stage").appendChild(el); s.el = el;
  s.anims = $$("[data-a]", el).map(e => ({ e, a: e.dataset.a, d: +e.dataset.d }));
  s.counts = $$("[data-count]", el).map(e => { const [f, n, dp, sg, d, du] = e.dataset.count.split(",").map(Number); return { e, f, n, dp, sg, d, du }; });
  if (s.type === "chart") setupChart(s);
  s.draws = $$("[data-draw]", el).map(e => { const [d, du] = e.dataset.draw.split(",").map(Number); return { e, d, du, len: 0 }; });
  return s;
});
window.TOTAL = t0;
S.forEach(s => s.draws.forEach(w => { w.len = w.e.getTotalLength() + 2; w.e.style.strokeDasharray = w.len; w.e.style.strokeDashoffset = w.len; }));

function setupChart(s) {
  const box = $("#ch" + s.i, s.el), svg = $("svg", box), NS = "http://www.w3.org/2000/svg";
  const X0 = 90, X1 = 800, Y0 = 140, Y1 = 660;
  const all = s.series.flatMap(x => x.v).concat(s.base != null ? [s.base] : []), mx = Math.max(...all.map(Math.abs)) * 1.15;
  const sym = s.symmetric !== false && Math.min(...all) < 0;
  const rg = Math.max(...all) - Math.min(...all) || 1;
  const lo = sym ? -mx : s.tight ? Math.min(...all) - rg * .15 : Math.min(...all) * .97, hi = sym ? mx : s.tight ? Math.max(...all) + rg * .25 : Math.max(...all) * 1.03;
  const yOf = v => Y1 - (v - lo) / (hi - lo) * (Y1 - Y0);
  const mk = (tag, a) => { const e = document.createElementNS(NS, tag); for (const k in a) e.setAttribute(k, a[k]); svg.appendChild(e); return e; };
  const ticks = s.ticks || (sym ? [-mx / 1.15, 0, mx / 1.15] : [lo, (lo + hi) / 2, hi]);
  ticks.forEach(v => {
    mk("line", { x1: X0, x2: X1, y1: yOf(v), y2: yOf(v), stroke: v === 0 ? "var(--psub)" : "rgba(128,128,128,.18)", "stroke-width": v === 0 ? 3 : 2 });
    const l = document.createElement("div"); l.className = "lab"; l.style.cssText = `left:0;width:${X0 - 12}px;text-align:right;top:${yOf(v) - 20}px`;
    l.textContent = s.tickfmt === "k" ? (Math.round(v / 1000) + "k") : fmtNum(v, s.tickdp || 0); box.appendChild(l);
  });
  if (s.base != null) {
    mk("line", { x1: X0, x2: X1, y1: yOf(s.base), y2: yOf(s.base), stroke: "var(--psub)", "stroke-width": 3, "stroke-dasharray": "10 12", opacity: .7 });
    const l = document.createElement("div"); l.className = "lab"; l.style.cssText = `left:${X1 + 12}px;top:${yOf(s.base) - 18}px;font-size:26px;white-space:nowrap`; l.textContent = s.baselab || ""; box.appendChild(l);
  }
  if (s.xlabs) s.xlabs.forEach((t, i) => { const l = document.createElement("div"); l.className = "lab"; l.style.cssText = `top:${Y1 + 14}px;left:${X0 + (X1 - X0) * i / (s.xlabs.length - 1) - 100}px;width:200px;text-align:center;white-space:nowrap`; l.textContent = t; box.appendChild(l); });
  s.lines = s.series.map(x => {
    const L = { v: x.v, c: x.c, dp: x.dp || 0, sign: !!x.sign, below: x.below, nolab: x.nolab };
    L.glow = mk("path", { fill: "none", stroke: x.c, "stroke-width": 16, "stroke-opacity": .18, "stroke-linejoin": "round", "stroke-linecap": "round" });
    L.p = mk("path", { fill: "none", stroke: x.c, "stroke-width": 7, "stroke-linejoin": "round", "stroke-linecap": "round" });
    L.dot = mk("circle", { r: 13, fill: x.c, stroke: "var(--panel)", "stroke-width": 5 });
    L.lab = document.createElement("div"); L.lab.className = "endlab"; L.lab.style.color = x.c; box.appendChild(L.lab);
    return L;
  });
  s.draw = k => s.lines.forEach(L => {
    const n = L.v.length, xOf = i => X0 + (X1 - X0) * i / Math.max(1, n - 1), f = k * (n - 1), m = Math.floor(f);
    let d = "", last;
    for (let i = 0; i <= Math.min(m, n - 1); i++) d += (i ? "L" : "M") + xOf(i) + " " + yOf(L.v[i]);
    if (m < n - 1) { const fr = f - m, v = lerp(L.v[m], L.v[m + 1], fr); last = [lerp(xOf(m), xOf(m + 1), fr), yOf(v), v]; d += "L" + last[0] + " " + last[1]; }
    else last = [xOf(n - 1), yOf(L.v[n - 1]), L.v[n - 1]];
    L.p.setAttribute("d", d); L.glow.setAttribute("d", d);
    L.dot.setAttribute("cx", last[0]); L.dot.setAttribute("cy", last[1]);
    L.lab.textContent = fmtNum(last[2], L.dp, L.sign);
    const w = L.lab.offsetWidth; L.lab.style.left = clamp(last[0] - w / 2, 90, 940 - w) + "px";
    L.lab.style.top = (L.below ? last[1] + 22 : last[1] - 88) + "px";
    L.p.style.opacity = L.glow.style.opacity = L.dot.style.opacity = L.lab.style.opacity = k > 0 ? 1 : 0;
    if (L.nolab) L.lab.style.opacity = 0;
  });
}

// 효과: 서리/눈 입자
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const flakes = TH.particles ? Array.from({ length: 46 }, () => ({ x: rnd() * 1080, y: rnd() * 1920, r: 3 + rnd() * 7, v: 40 + rnd() * 90, a: .12 + rnd() * .35, w: rnd() * 6 })) : [];
flakes.forEach(f => { const e = document.createElement("div"); e.className = "flake"; e.style.width = e.style.height = f.r * 2 + "px"; e.style.opacity = f.a; f.el = e; $("#fx").appendChild(e); });

function tr(e, o, x, y, s, origin) { e.style.opacity = o; e.style.transform = `translate(${x}px,${y}px) scale(${s})`; }

window.render = t => {
  const wait = [];
  flakes.forEach(f => { f.el.style.transform = `translate(${f.x + Math.sin(t + f.w) * 20}px,${(f.y + t * f.v) % 1960 - 40}px)`; });
  S.forEach((s, si) => {
    const lt = t - s.start, last = si === S.length - 1, first = si === 0;
    // 첫 장면은 0초에 이미 완성된 모습(Threads·미리보기 첫 화면 = 표지)
    const L = first ? lt + (s.pre || 0) : lt;
    if (lt < -0.05 || (lt > s.dur && !last)) { s.el.style.display = "none"; return; }
    s.el.style.display = "block";
    const out = last ? 0 : P(lt, s.dur - .38, s.dur, easeInOut);
    s.el.style.opacity = 1 - out; s.el.style.transform = `translateY(${-80 * out}px)`;
    s.anims.forEach(({ e, a, d }) => {
      const k = P(L, d, d + .45), kb = P(L, d, d + .6, back);
      if (a === "rise") tr(e, k, 0, 60 * (1 - k), 1);
      else if (a === "drop") tr(e, k, 0, -30 * (1 - k), 1);
      else if (a === "fade") tr(e, k, 0, 0, 1);
      else if (a === "left") tr(e, k, -120 * (1 - k), 0, 1);
      else if (a === "pop") tr(e, P(L, d, d + .25), 0, 0, .6 + .4 * kb);
      else if (a === "tile") tr(e, P(L, d, d + .3), 0, 110 * (1 - kb), 1);
      else if (a === "word") tr(e, P(L, d, d + .25), 0, 70 * (1 - kb), 1);
      else if (a === "big") tr(e, P(L, d, d + .3), 0, 0, .9 + .1 * kb);
      else if (a === "grow") { e.style.opacity = 1; e.style.transform = `scaleY(${k})`; }
      else if (a === "growx") { e.style.opacity = k > 0 ? 1 : 0; e.style.transform = `scaleX(${P(L, d, d + .8, easeOut)})`; }
      else if (a === "pose") tr(e, P(L, d, d + .3), 0, 240 * (1 - kb) + breathe(t), 1);
      else if (a === "card") tr(e, P(L, d, d + .3), 0, 160 * (1 - kb), .92 + .08 * k);
    });
    s.draws.forEach(w => { w.e.style.strokeDashoffset = w.len * (1 - P(L, w.d, w.d + w.du, easeInOut)); });
    s.counts.forEach(c => { c.e.textContent = fmtNum(lerp(c.f, c.n, P(L, c.d, c.d + c.du, easeInOut)), c.dp, !!c.sg); });
    if (s.draw) s.draw(P(L, .5, .5 + (s.drawdur || 2.2), easeInOut));
    if (s.type === "photo") { const im = $(".photo img", s.el); im.style.transform = `scale(${1.04 + .08 * clamp(lt / s.dur)})`; im.style.transformOrigin = `${(s.fx ?? .5) * 100}% ${(s.fy ?? .5) * 100}%`; }
    if (s.type === "dart") {
      const chips = [...s.el.querySelectorAll(".dchip")], n = s.seq.length, t0 = s.spin0 || .6, t1 = t0 + (s.spin || 2.6);
      const k = Math.min(n - 1, Math.floor(easeOut((L - t0) / (t1 - t0)) * n)), land = t1 + .35, done = L >= land;
      chips.forEach((c, i) => { c.className = "dchip" + (done && i === s.hit ? " hit" : (!done && L >= t0 && i === s.seq[k]) ? " on" : ""); c.style.opacity = done && i !== s.hit ? .3 : 1; });
      const dv = s.el.querySelector(".dart"), tgt = chips[s.hit];
      if (L >= t1 - .05) {
        const er = s.el.getBoundingClientRect(), r = tgt.getBoundingClientRect(), tx = r.left - er.left + r.width / 2, ty = r.top - er.top + r.height / 2;
        const u = easeOut((L - t1) / .35), x = lerp(1180, tx, u), y = lerp(1700, ty, u) - Math.sin(u * Math.PI) * 180;
        const shake = done ? Math.sin((L - land) * 40) * Math.max(0, 1 - (L - land) * 3) * 6 : 0;
        dv.style.opacity = 1; dv.style.transform = `translate(${x}px,${y - 30}px) rotate(${35 + shake}deg)`;
      } else dv.style.opacity = 0;
    }
    if (s.type === "video") {  // 영상이 장면보다 짧으면 앞뒤로 왕복
      const n = s.nframes, m = Math.floor(Math.max(0, lt) * (s.fps || 30)), per = Math.max(1, 2 * (n - 1));
      let k = n > 1 ? m % per : 0; if (k > n - 1) k = per - k;
      const im = $(".vid img", s.el), src = `${s.frames}/f${String(k + 1).padStart(4, "0")}.jpg`;
      if (im.dataset.k !== String(k)) { im.dataset.k = k; im.src = src; wait.push(im.decode().catch(() => 0)); }
    }
    if (s.type === "cards" && s.srcs.length > 1) {
      const per = (s.dur - .6) / s.srcs.length; let x = 0;
      for (let j = 1; j < s.srcs.length; j++) x += P(lt, .6 + per * j - .25, .6 + per * j + .2, easeInOut);
      $(".strip", s.el).style.transform = `translateX(${-1000 * x}px)`;
    }
  });
  if (wait.length) return Promise.all(wait);
};
waitImages();
</script>
</body></html>
